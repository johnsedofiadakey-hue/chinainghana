<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0b1b3f">
<title>You're offline · China-in-Ghana</title>
<style>
  :root { color-scheme: light; }
  body { margin: 0; min-height: 100dvh; display: flex; align-items: center; justify-content: center; background: #f7f8fb; color: #0b1b3f;
         font-family: Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; padding: 16px; }
  .card { max-width: 360px; text-align: center; background: #fff; border-radius: 20px; padding: 32px 24px; box-shadow: 0 4px 16px rgb(11 27 63 / .08); }
  img { width: 64px; height: 64px; border-radius: 16px; }
  h1 { font-size: 22px; margin: 16px 0 6px; }
  p { color: #5b6785; margin: 0 0 20px; line-height: 1.5; }
  button { height: 48px; padding: 0 22px; border: 0; border-radius: 14px; background: #16306e; color: #fff; font: inherit; font-weight: 600; cursor: pointer; }
</style>
</head>
<body>
  <div class="card">
    <img src="/icons/icon-192.png" alt="">
    <h1>You're offline</h1>
    <p>Check your data or Wi-Fi. Pages you opened before still work, and your cart is saved on this phone.</p>
    <button onclick="location.reload()">Try again</button>
  </div>
</body>
</html>
